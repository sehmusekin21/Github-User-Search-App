<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.35.0/tabler-icons.min.css"
      integrity="sha512-gzw5zNP2TRq+DKyAqZfDclaTG4dOrGJrwob2Fc8xwcJPDPVij0HowLIMZ8c1NefFM0OZZYUUUNoPfcoI5jqudw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              accent: "#0079FF",
              "lt-bg": "#F6F8FF",
              "lt-card": "#FEFEFE",
              "lt-text": "#2B3442",
              "lt-sub": "#4B6A9B",
              "lt-muted": "#697C9A",
              "lt-logo": "#222731",
              "dk-bg": "#141D2F",
              "dk-card": "#1E2A47",
            },
            boxShadow: {
              card: "0px 16px 30px -10px rgba(70,96,187,0.20)",
            },
          },
        },
      };
    </script>
    <style>
      * {
        font-family: "Space-Mono", monospace;
      }
    </style>
    <script src="script.js" defer></script>
  </head>
  <body
    class="bg-lt-bg dark:bg-dk-bg min-h-screen transition-colors duration-300 py-8 px-6 md:flex md:items-center md:justify-center md:py-0"
  >
    <div class="w-full max-w-[730px]">
      <header class="flex items-center justify-between" id="header">
        <h2 class="text-[26px] font-bold text-lt-logo dark:text-white">
          Github User Search App
        </h2>
        <button id="theme-toggle" class="flex items-center gap-4 group">
          <span
            id="theme-label"
            class="text-[13px] font-bold tracking-[2.5px] text-lt-muted dark:text-white group-hover:text-lt-text dark:group-hover:text-gray-300 transition-colors"
            >DARK</span
          >
          <i
            id="icon-moon"
            class="ti ti-moon w-5 h-5 text-lt-muted dark:text-white"
          ></i>
          <i id="icon-sun" class="ti ti-sun w-5 h-5 hidden text-white"></i>
        </button>
      </header>

      <form
        id="search-form"
        class="flex items-center bg-lt-card dark:bg-dk-card rounded-2xl shadow-card px-4 md:px-6 h-[60px] md:h-[69px] mb-4 gap-2 md:gap-4 md:mb-6"
      >
        <i class="ti ti-search w-5 h-5 text-accent"></i>
        <input
          id="search-input"
          type="text"
          placeholder="Search Github Username..."
          class="flex-1 bg-transparent text-[13px] md:text-lg text-lt-text dark:text-white placeholder:text-lt-sub dark:placeholder:text-white/50 outline-none"
        />
        <p
          id="error-msg"
          class="hidden text-[#F74646] text-[11px] md:text-[15px] font-bold whitepsace-nowrap"
        >
          No results
        </p>
        <button
          type="submit"
          class="bg-accent text-white font-bold text-[14px] md:text-[16px] px-4 md:px-6 py-3 rounded-[10px] hover:bg-[#60ABFF] transition-colors"
        >
          Search
        </button>
      </form>

      <div
        class="bg-lt-card dark:bg-dk-card rounded-2xl shadow-card p-6 md:p-12"
      >
        <!-- Top: avatar + info -->
        <div class="flex gap-5 md:gap-[37px]">
          <img
            id="avatar"
            src="https://avatars.githubusercontent.com/u/583231"
            alt="avatar"
            class="w-[70px] h-[70px] md:w-[117px] md:h-[117px] rounded-full shrink-0 object-cover"
          />

          <div class="flex-1 min-w-0">
            <!-- Name row -->
            <div
              class="flex flex-col md:flex-row md:items-start md:justify-between gap-0.5 md:gap-0"
            >
              <div>
                <h2
                  id="user-name"
                  class="text-[16px] md:text-[26px] font-bold text-lt-text dark:text-white leading-tight"
                >
                  The Octocat
                </h2>
                <p
                  id="user-login"
                  class="text-[13px] md:text-[16px] text-accent mt-1"
                >
                  @octocat
                </p>
              </div>
              <p
                id="user-joined"
                class="text-[11px] md:text-[15px] text-lt-muted dark:text-white mt-1 md:mt-[9px] "
              >
                Joined 25 Jan 2011
              </p>
            </div>
            <!-- Bio: desktop only (inline with avatar col) -->
            <p
              id="bio-desktop"
              class="hidden md:block text-[15px] text-lt-sub dark:text-white/75 mt-5 leading-relaxed"
            >
              This profile has no bio
            </p>
          </div>
        </div>

        <!-- Bio: mobile only -->
        <p
          id="bio-mobile"
          class="md:hidden text-[13px] text-lt-sub dark:text-white/75 mt-5"
        >
          This profile has no bio
        </p>

        <!-- Stats -->
        <div
          class="md:ml-[154px] bg-lt-bg dark:bg-dk-bg rounded-[10px] flex justify-around md:justify-start md:gap-[88px] px-4 md:px-8 py-4 md:py-5 mt-6 md:mt-8 mb-6 md:mb-9"
        >
          <div class="text-center md:text-left">
            <p class="text-[11px] md:text-[13px] text-lt-sub dark:text-white">
              Repos
            </p>
            <p
              id="repos"
              class="text-[16px] md:text-[22px] font-bold text-lt-text dark:text-white mt-1 md:mt-2"
            >
              8
            </p>
          </div>
          <div class="text-center md:text-left">
            <p class="text-[11px] md:text-[13px] text-lt-sub dark:text-white">
              Followers
            </p>
            <p
              id="followers"
              class="text-[16px] md:text-[22px] font-bold text-lt-text dark:text-white mt-1 md:mt-2"
            >
              3938
            </p>
          </div>
          <div class="text-center md:text-left">
            <p class="text-[11px] md:text-[13px] text-lt-sub dark:text-white">
              Following
            </p>
            <p
              id="following"
              class="text-[16px] md:text-[22px] font-bold text-lt-text dark:text-white mt-1 md:mt-2"
            >
              9
            </p>
          </div>
        </div>

        <!-- Info grid -->
        <div class="md:ml-[154px] grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Location -->
          <div id="row-location" class="flex items-center gap-[19px]">
            <svg
              class="w-[14px] h-5 shrink-0 fill-lt-sub dark:fill-white"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 384 512"
            >
              <path
                d="M172.268 501.67C26.97 291.031 0 269.413 0 192 0 85.961 85.961 0 192 0s192 85.961 192 192c0 77.413-26.97 99.031-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0zM192 272c44.183 0 80-35.817 80-80s-35.817-80-80-80-80 35.817-80 80 35.817 80 80 80z"
              />
            </svg>
            <span
              id="location"
              class="text-[13px] md:text-[15px] text-lt-sub dark:text-white"
              >San Francisco</span
            >
          </div>

          <!-- Twitter -->
          <div id="row-twitter" class="flex items-center gap-[19px]">
            <svg
              class="w-5 h-5 shrink-0 fill-lt-sub dark:fill-white"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 512 512"
            >
              <path
                d="M459.37 151.716c.325 4.548.325 9.097.325 13.645 0 138.72-105.583 298.558-298.558 298.558-59.452 0-114.68-17.219-161.137-47.106 8.447.974 16.568 1.299 25.34 1.299 49.055 0 94.213-16.568 130.274-44.832-46.132-.975-84.792-31.188-98.112-72.772 6.498.974 12.995 1.624 19.818 1.624 9.421 0 18.843-1.3 27.614-3.573-48.081-9.747-84.143-51.98-84.143-102.985v-1.299c13.969 7.797 30.214 12.67 47.431 13.319-28.264-18.843-46.781-51.005-46.781-87.391 0-19.492 5.197-37.36 14.294-52.954 51.655 63.675 129.3 105.258 216.365 109.807-1.624-7.797-2.599-15.918-2.599-24.04 0-57.828 46.782-104.934 104.934-104.934 30.213 0 57.502 12.67 76.67 33.137 23.715-4.548 46.456-13.32 66.599-25.34-7.798 24.366-24.366 44.833-46.132 57.827 21.117-2.273 41.584-8.122 60.426-16.243-14.292 20.791-32.161 39.308-52.628 54.253z"
              />
            </svg>
            <span
              id="twitter"
              class="text-[13px] md:text-[15px] text-lt-sub dark:text-white"
              >Not Available</span
            >
          </div>

          <!-- Blog/URL -->
          <div id="row-blog" class="flex items-center gap-[19px]">
            <svg
              class="w-5 h-5 shrink-0 fill-lt-sub dark:fill-white"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 512 512"
            >
              <path
                d="M326.612 185.391c59.747 59.809 58.927 155.698.36 214.59-.11.12-.24.25-.36.37l-67.2 67.2c-59.27 59.27-155.699 59.262-214.96 0-59.27-59.26-59.27-155.7 0-214.96l37.106-37.106c9.84-9.84 26.786-3.3 27.294 10.606.648 17.722 3.826 35.527 9.69 52.721 1.986 5.822.567 12.262-3.783 16.612l-13.087 13.087c-28.026 28.026-28.905 73.66-1.155 101.96 28.024 28.579 74.086 28.749 102.325.51l67.2-67.19c28.191-28.191 28.073-73.757 0-101.83-3.701-3.694-7.429-6.564-10.341-8.569a16.037 16.037 0 01-6.947-12.606c-.396-10.567 3.348-21.456 11.698-29.806l21.054-21.055c5.521-5.521 14.182-6.199 20.584-1.731a152.482 152.482 0 0120.522 17.197zM467.547 44.449c-59.261-59.262-155.69-59.27-214.96 0l-67.2 67.2c-.12.12-.25.25-.36.37-58.566 58.892-59.387 154.781.36 214.59a152.454 152.454 0 0020.521 17.196c6.402 4.468 15.064 3.789 20.584-1.731l21.054-21.055c8.35-8.35 12.094-19.239 11.698-29.806a16.037 16.037 0 00-6.947-12.606c-2.912-2.005-6.64-4.875-10.341-8.569-28.073-28.073-28.191-73.639 0-101.83l67.2-67.19c28.239-28.239 74.3-28.069 102.325.51 27.75 28.3 26.872 73.934-1.155 101.96l-13.087 13.087c-4.35 4.35-5.769 10.79-3.783 16.612 5.864 17.194 9.042 34.999 9.69 52.721.509 13.906 17.454 20.446 27.294 10.606l37.106-37.106c59.271-59.259 59.271-155.699.001-214.959z"
              />
            </svg>
            <a
              id="blog"
              href="#"
              class="text-[13px] md:text-[15px] text-lt-sub dark:text-white hover:underline truncate"
              >https://github.blog</a
            >
          </div>

          <!-- Company -->
          <div id="row-company" class="flex items-center gap-[19px]">
            <svg
              class="w-5 h-5 shrink-0 fill-lt-sub dark:fill-white"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 448 512"
            >
              <path
                d="M436 480h-20V24c0-13.255-10.745-24-24-24H56C42.745 0 32 10.745 32 24v456H12c-6.627 0-12 5.373-12 12v20h448v-20c0-6.627-5.373-12-12-12zM128 76c0-6.627 5.373-12 12-12h40c6.627 0 12 5.373 12 12v40c0 6.627-5.373 12-12 12h-40c-6.627 0-12-5.373-12-12V76zm0 96c0-6.627 5.373-12 12-12h40c6.627 0 12 5.373 12 12v40c0 6.627-5.373 12-12 12h-40c-6.627 0-12-5.373-12-12v-40zm52 148h-40c-6.627 0-12-5.373-12-12v-40c0-6.627 5.373-12 12-12h40c6.627 0 12 5.373 12 12v40c0 6.627-5.373 12-12 12zm76 160h-64v-84c0-6.627 5.373-12 12-12h40c6.627 0 12 5.373 12 12v84zm64-172c0 6.627-5.373 12-12 12h-40c-6.627 0-12-5.373-12-12v-40c0-6.627 5.373-12 12-12h40c6.627 0 12 5.373 12 12v40zm0-96c0 6.627-5.373 12-12 12h-40c-6.627 0-12-5.373-12-12v-40c0-6.627 5.373-12 12-12h40c6.627 0 12 5.373 12 12v40zm0-96c0 6.627-5.373 12-12 12h-40c-6.627 0-12-5.373-12-12V76c0-6.627 5.373-12 12-12h40c6.627 0 12 5.373 12 12v40z"
              />
            </svg>
            <span
              id="company"
              class="text-[13px] md:text-[15px] text-lt-sub dark:text-white"
              >@github</span
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
